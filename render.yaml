services:
  - type: web
    name: crypto-arena-50x
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_tournament.py
    plan: free
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: WEB_HOST
        value: 0.0.0.0
      - key: WEB_PORT
        value: 10000
